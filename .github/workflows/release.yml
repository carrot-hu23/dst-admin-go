name: release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dst-admin-go
  # The web UI lives in a companion repository. Defaults to the same owner as
  # this repository so forks automatically build their own frontend fork,
  # and upstream automatically builds the upstream frontend.
  FRONTEND_REPO: ${{ vars.FRONTEND_REPO || format('{0}/dst-manage-web2', github.repository_owner) }}
  FRONTEND_REF: ${{ vars.FRONTEND_REF || 'main' }}

jobs:
  frontend:
    name: Build web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_REF }}
          path: web

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist

  package:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: tar.gz
          - goos: windows
            goarch: amd64
            ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: dist

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          out="dst-admin-go"
          if [ "${{ matrix.goos }}" = "windows" ]; then out="dst-admin-go.exe"; fi
          go build -o "$out" cmd/server/main.go

      - name: Assemble package
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          stage="dst-admin-go-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$stage"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp dst-admin-go.exe "$stage"/
          else
            cp dst-admin-go "$stage"/
          fi
          cp -r dist "$stage"/dist
          cp -r static "$stage"/static
          cp config.yml "$stage"/config.yml
          cp README.md README-EN.md README-ES.md LICENSE "$stage"/ 2>/dev/null || true
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd "$stage" && zip -qr "../${stage}.zip" .)
          else
            tar -czf "${stage}.tar.gz" "$stage"
          fi

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dst-admin-go-*.${{ matrix.ext }}

  docker:
    name: Build and publish container image
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: scripts/docker/dist

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build linux/amd64 binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -o scripts/docker/dst-admin-go cmd/server/main.go

      - name: Stage build context
        run: |
          cp -r static scripts/docker/static
          cp config.yml scripts/docker/config.yml

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Ghcr login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: scripts/docker
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [package, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: artifacts/*
          generate_release_notes: true
